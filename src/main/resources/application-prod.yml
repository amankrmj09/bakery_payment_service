spring:
  datasource:
    url: ${PAYMENT_DB_URL}
    username: ${PAYMENT_DB_USER}
    password: ${PAYMENT_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
payment:
  gateways: {}
  limits:
    min-amount: ${PAYMENT_MIN_AMOUNT:50.00}
    max-amount: ${PAYMENT_MAX_AMOUNT:500000.00}
    daily-limit: ${PAYMENT_DAILY_LIMIT:1000000.00}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
